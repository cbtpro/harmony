name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - "**.md"
      - "**.spec.js"
      - ".idea"
      - ".vscode"
      - ".dockerignore"
      - "Dockerfile"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-release:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            arch: arm64
            extensions: dmg
          - platform: macos
            runner: macos-15-intel
            arch: x64
            extensions: dmg
          - platform: linux
            runner: ubuntu-22.04
            arch: x64
            extensions: AppImage deb
          - platform: windows
            runner: windows-2025
            arch: x64
            extensions: exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match package.json version v$version"
            exit 1
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build Release Files
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: npm run build -- "--$BUILD_ARCH"

      - name: Collect installers
        shell: bash
        env:
          PACKAGE_EXTENSIONS: ${{ matrix.extensions }}
        run: |
          shopt -s nullglob
          mkdir -p release-assets
          read -ra extensions <<< "$PACKAGE_EXTENSIONS"
          for extension in "${extensions[@]}"; do
            matches=(release/*/*."$extension")
            if (( ${#matches[@]} != 1 )) || [[ ! -s "${matches[0]}" ]]; then
              echo "::error::Expected one nonempty .$extension installer"
              exit 1
            fi
            cp "${matches[0]}" release-assets/
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmony-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: [test-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: harmony-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          LC_ALL: C
        shell: bash
        run: |
          shopt -s nullglob
          cd release-assets
          installers=(*.dmg *.AppImage *.deb *.exe)
          if (( ${#installers[@]} != 5 )); then
            echo "::error::Expected all five installers before publishing $TAG"
            exit 1
          fi
          sha256sum -- "${installers[@]}" > SHA256SUMS
          args=(--verify-tag --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${installers[@]}" SHA256SUMS "${args[@]}"
